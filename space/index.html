<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Terre 3D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="bar" id="bar">
    <select id="viewSel" title="Vue">
      <option value="earth">🌍 Terre</option>
      <option value="moon">🌙 Lune</option>
      <option value="sun">☀ Soleil</option>
    </select>
    <button id="bSats">🛰 <span>Satellites</span></button>
    <button id="bSat">🚀 <span>Fusées</span></button>
    <button id="bLaunch" hidden>🚀 <span>Lancement</span></button>
  </div>
  <div id="info"></div>
</div>
<div id="viewTxt"><b>Vue</b> <button id="bCopy">📋 Copier</button><br><code id="viewJson"></code>
  <div id="nudge">cap <button data-n="y-">◀</button><button data-n="y+">▶</button> pitch <button data-n="p+">▲</button><button data-n="p-">▼</button> dist <button data-n="d-">＋</button><button data-n="d+">－</button> pas <button id="bStep">1°</button></div></div>
<label class="sw sw2" title="Afficher les tailles réelles (diamètres) du Soleil, de la Lune et de la Terre"><input type="checkbox" id="mtChk"><span class="track"><span class="ic">·</span><span class="ic">📏</span><span class="knob"></span></span></label>
<div id="timeBar"><span id="timeTxt"></span><span class="tb"><button data-sp="1" class="on">Temps réel</button><button data-sp="3600">1 h/s</button><button data-sp="21600">6 h/s</button><button data-sp="86400">1 j/s</button><button data-sp="432000">5 j/s</button><button id="bNow" title="Revenir à maintenant">⟳</button></span></div>
<div id="launchPanel" hidden></div>
<div id="satPanel" hidden></div>
<div id="satsPanel" hidden></div>
<div id="story" hidden></div>
<div id="timeline" hidden></div>
<div id="scale"><div id="scaleBar"></div><div id="scaleTxt"></div></div>
<div id="issLabel">ISS</div>
<div id="msg">Chargement…</div>
<div id="err" hidden></div>
<script>addEventListener("error", function (e) { var d = document.getElementById("err"); if (!d) return; d.hidden = false; d.textContent += "Erreur : " + (e.message || "chargement") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "") + "\n"; });</script>
<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/satellite.min.js"></script>
<script src="js/data/surface-earth.js"></script>
<script src="js/data/earth-borders.js"></script>
<script src="js/earth.js"></script>
<script src="js/gltf-mini.js"></script>
<script src="js/stack-models.js"></script>
<script src="js/physics.js"></script>
<script src="js/launch.js"></script>
<script src="js/rockets.js"></script>
<script src="js/flight-plan.js"></script>
<script src="js/ephemeris.js"></script>
<script src="js/flight-object.js"></script>
<script src="js/data/plans.js"></script>
<script src="js/data/objects.js"></script>
<script src="js/iss.js"></script>
<script src="js/story.js"></script>
<script src="js/data/surface-moon.js"></script>
<script src="js/launch-3d.js"></script>
<script src="js/sat-lite.js"></script>
<script src="js/moon.js"></script>
<script src="js/controls.js"></script>
<script src="js/main.js"></script>
</body>
</html>
