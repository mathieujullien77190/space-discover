<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Architecture de Terre 3D, ISS et système solaire</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2a37"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- Navigateur -->
  <rect x="20" y="20" width="430" height="520" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#1f2a37">Navigateur</text>

  <rect x="50" y="70" width="370" height="70" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="235" y="98" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">Interface React / TypeScript</text>
  <text x="235" y="120" font-size="12.5" text-anchor="middle" fill="#5b6b7c">EngineHost · menus · fiches d'astres · barre de temps</text>

  <rect x="50" y="190" width="370" height="60" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="235" y="215" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">Store Zustand</text>
  <text x="235" y="236" font-size="12.5" text-anchor="middle" fill="#5b6b7c">état publié par le moteur + état d'interface</text>

  <rect x="50" y="300" width="370" height="220" rx="10" fill="#fff7ec" stroke="#b5651d" stroke-width="1.5"/>
  <text x="235" y="328" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">Moteur 3D (three.js, JS pur)</text>
  <text x="235" y="350" font-size="12.5" text-anchor="middle" fill="#5b6b7c">app.js : createEngine, boucle de rendu</text>
  <text x="235" y="368" font-size="12.5" text-anchor="middle" fill="#5b6b7c">n'importe ni React ni le store</text>

  <rect x="72" y="384" width="326" height="124" rx="8" fill="#ffffff" stroke="#d9b48a" stroke-width="1"/>
  <g font-size="12.5" fill="#1f2a37" text-anchor="middle">
    <text x="235" y="410">earth · atmosphere · clouds · terrain-tiles</text>
    <text x="235" y="432">bodies · ephemeris · physics · launch</text>
    <text x="235" y="454">iss (SGP4, TLE embarqué) · controls</text>
    <text x="235" y="476">data/ généré par tools/make-objects.js</text>
    <text x="235" y="498" fill="#5b6b7c">objets lus depuis des JSON</text>
  </g>

  <!-- React <-> store <-> moteur -->
  <line x1="150" y1="140" x2="150" y2="188" stroke="#1f2a37" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="140" y="170" font-size="11.5" text-anchor="end" fill="#1f2a37">actions</text>
  <line x1="320" y1="188" x2="320" y2="142" stroke="#1f2a37" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="170" font-size="11.5" fill="#1f2a37">état</text>
  <line x1="150" y1="250" x2="150" y2="298" stroke="#1f2a37" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="140" y="280" font-size="11.5" text-anchor="end" fill="#1f2a37">commandes</text>
  <line x1="320" y1="298" x2="320" y2="252" stroke="#1f2a37" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="280" font-size="11.5" fill="#1f2a37">publish</text>

  <!-- Hébergement -->
  <rect x="540" y="20" width="440" height="250" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="560" y="48" font-size="15" font-weight="700" fill="#1f2a37">GitHub Pages (site statique)</text>

  <g stroke="#1f2a37" stroke-width="1.5" fill="#ffffff">
    <rect x="560" y="70" width="400" height="70" rx="9"/>
    <rect x="560" y="170" width="400" height="80" rx="9"/>
  </g>
  <text x="575" y="97" font-size="13.5" font-weight="700" fill="#1f2a37">Application Next.js (export statique)</text>
  <text x="575" y="119" font-size="11.5" fill="#5b6b7c">next build → out/ · rendue uniquement côté navigateur</text>
  <text x="575" y="197" font-size="13.5" font-weight="700" fill="#1f2a37">public/objects · public/data</text>
  <text x="575" y="219" font-size="11.5" fill="#5b6b7c">un JSON par astre ou satellite, modèles glb,</text>
  <text x="575" y="236" font-size="11.5" fill="#5b6b7c">plans de vol, photos aériennes</text>

  <!-- Services externes -->
  <rect x="540" y="300" width="440" height="240" rx="14" fill="#fdf0f0" stroke="#b04a4a" stroke-width="1.5"/>
  <text x="560" y="328" font-size="15" font-weight="700" fill="#1f2a37">Services externes (images et tuiles)</text>
  <g stroke="#b04a4a" stroke-width="1.5" fill="#ffffff">
    <rect x="560" y="342" width="400" height="54" rx="9"/>
    <rect x="560" y="412" width="400" height="54" rx="9"/>
    <rect x="560" y="482" width="400" height="44" rx="9"/>
  </g>
  <g font-size="13.5" font-weight="700" fill="#1f2a37">
    <text x="575" y="365">clouds.matteason.co.uk</text>
    <text x="575" y="435">ArcGIS World Imagery</text>
    <text x="575" y="509">AWS elevation-tiles (Terrarium)</text>
  </g>
  <g font-size="11.5" fill="#5b6b7c">
    <text x="575" y="384">couverture nuageuse, mise à jour toutes les 3 h</text>
    <text x="575" y="454">tuiles satellite sous 800 km d'altitude</text>
  </g>

  <!-- Flèches -->
  <g stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M560 105 H422"/>
    <path d="M420 320 H480 V210 H558"/>
    <path d="M420 369 H558"/>
    <path d="M420 439 H558"/>
    <path d="M420 504 H558"/>
  </g>
  <g font-size="11.5" fill="#1f2a37">
    <text x="438" y="98">HTML + JS</text>
    <text x="488" y="270">fetch JSON / glb</text>
  </g>
</svg>
