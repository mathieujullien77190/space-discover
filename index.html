<head>
<meta charset="utf-8">

<title>Terre 3D</title>

</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="bar" id="bar">
    <button id="bEarth" class="on">🌍 <span>Terre</span></button>
    <button id="bIss">🛰 <span>ISS</span></button>
    <button id="bMoonView">🌙 <span>Lune</span></button>
    <button id="bSunView">☀ <span>Soleil</span></button>
    <button id="bSun">🌗 <span>Jour/nuit</span></button>
    <button id="bLaunch" hidden>🚀 <span>Lancement</span></button>
    <span id="issOnly" hidden><button id="bBehind">👁 <span>Vue dessus</span></button><button id="bFeat">📐 <span>Détails ISS</span></button></span>
    <div id="feat" hidden></div>
  </div>
  <div id="info"></div>
</div>
<div id="viewTxt" hidden><b>Vue</b> <button id="bCopy">📋 Copier</button><br><code id="viewJson"></code>
  <div id="nudge">yaw <button data-n="y-">◀</button><button data-n="y+">▶</button> pitch <button data-n="p+">▲</button><button data-n="p-">▼</button> dist <button data-n="d-">＋</button><button data-n="d+">－</button> pas <button id="bStep">1°</button></div></div>
<div id="launchPanel" hidden></div>
<div id="story" hidden></div>
<div id="timeline" hidden></div>
<div id="scale"><div id="scaleBar"></div><div id="scaleTxt"></div></div>
<div id="issLabel">ISS</div>
<div id="msg">Chargement…</div>
